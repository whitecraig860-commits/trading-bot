name: TEMP real-data test (delete before merging)
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Trump feed, last posts and how the bot reads them
        run: |
          python -W ignore - <<'PY'
          import requests, trump
          r = requests.get(trump.FEED, timeout=20, headers={"User-Agent": "Mozilla/5.0 (setup-scanner-bot)"})
          print(r.status_code, r.headers.get("content-type"), len(r.text))
          posts = trump.parse_feed(r.text)
          print(len(posts), "posts")
          for p in posts[:15]:
              print(p["when"], "|", p["text"][:140].replace("\n", " "))
              print("    ->", [(h["market"], h["direction"], h["topic"]) for h in trump.read_post(p["text"])])
          PY
      - name: Morning briefing
        run: python -W ignore -c "import bot,argparse;c=bot.load_config('config.toml');print(bot.to_plain(bot.morning_briefing(c,argparse.Namespace(csv_dir=None))))" 2>/dev/null
      - name: Trump chores twice (first seeds, second would alert)
        run: python -W ignore -c "import bot,argparse;c=bot.load_config('config.toml');a=argparse.Namespace(csv_dir=None,no_telegram=True);ps={};print(bot.trump_chores(c,a,ps));print(len(ps['trump_seen']),'seen');print(bot.trump_chores(c,a,ps))" 2>/dev/null
