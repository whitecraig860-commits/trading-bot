name: TEMP real-data test (delete before merging)
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scalper on 4 Nov, old vs new rules (share price)
        run: |
          python -W ignore - 2>/dev/null <<'PY'
          import yfinance as yf, pandas as pd, scalper
          cfg, full = scalper.load_cfg("config.toml")
          for label, c in (("OLD (what traded live: 5-min, trend filter, no candle check)", dict(cfg, candle_filter=False)),
                           ("NEW (candle check on)", cfg)):
              print("==", label)
              tot = []
              for sym in cfg["symbols"]:
                  df = yf.Ticker(sym).history(start="2026-10-27", end="2026-11-06", interval="1m", prepost=False, auto_adjust=False)
                  df.index = df.index.tz_convert("America/New_York")
                  for t in scalper.backtest_frame(sym, df, c):
                      if t["day"] in ("2026-11-04", "2026-11-05"):
                          tot.append(t["r"])
                          print(f"  {t['day']} {sym} {t['side']} {t['t']:%H:%M} {t['why'][:45]:45} -> {t['exit']:7} {t['r']:+.2f}R")
              print(f"  total {sum(tot):+.2f}R over {len(tot)} trades")
          PY
      - name: Daily strategies, whole-account simulation at different risk caps
        run: python -W ignore bot.py backtest --portfolio 2>/dev/null | sed -n '/Whole-account/,$p'
