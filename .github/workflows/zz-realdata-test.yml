name: TEMP real-data test (delete before merging)
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: £1,000 accounts with live prices (copy of the state, nothing is saved or sent)
        run: |
          mkdir -p /tmp/st && cp state/paper.json state/scalper_log.csv /tmp/st/
          python -W ignore - <<'PY'
          import bot, scalper
          from pathlib import Path
          bot.STATE_DIR = Path("/tmp/st"); scalper.STATE = Path("/tmp/st")
          cfg = bot.load_config("config.toml")
          sc, full = scalper.load_cfg("config.toml")
          scalper.show_in(sc["account_currency"])
          print("USD->GBP", scalper._SHOW, "scalper account", scalper.money(scalper.account_usd(sc)),
                "risk", scalper.money(scalper.account_usd(sc) * sc["risk_per_trade_pct"] / 100),
                "max spend", scalper.money(scalper.account_usd(sc) * sc["max_premium_pct"] / 100))
          st = bot.load_state(cfg)
          print(st.get("restart_note"))
          print("free cash", round(bot.free_cash(st, cfg), 2))
          for p in st["positions"]:
              print(p["symbol"], p["status"], p.get("units"), round(bot.position_risk(p, st, cfg), 2))
          print("\n".join(bot.swing_lines(cfg, None)))
          for sym, e, s_ in (("SPY", 600, 597.6), ("BTC-USD", 100000, 99000)):
              print(sym, "pulse risk", round(bot.pulse_risk(cfg, e, s_), 2))
          PY
      - name: Portfolio report (10 years)
        run: python -W ignore bot.py backtest --portfolio 2>/dev/null | tail -30
