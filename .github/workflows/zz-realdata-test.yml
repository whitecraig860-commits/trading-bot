name: TEMP real-data test (delete before merging)
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest with the new settings
        run: python -W ignore bot.py backtest 2>/dev/null | grep -E "^==|All signals|Signals |would have" | head -30
      - name: Market read
        run: python -W ignore bot.py analyse 2>/dev/null | head -30
      - name: Full nightly scan (printed, not sent, not saved)
        run: python -W ignore bot.py scan --no-telegram 2>/dev/null | grep -E "SETUP|Exit plan|Risk check|Paper trad|Scan done|Checked|movers|Insider|Most volatile|Could not|Market read|Overall|^[A-Z^=-]+ (up|down)|WON|LOST" | head -60
      - name: One pulse pass (printed, not sent)
        run: python -W ignore bot.py pulse --no-telegram 2>/dev/null | head -80
      - name: Watch pass
        run: python -W ignore bot.py watch --no-telegram 2>/dev/null | head -30
