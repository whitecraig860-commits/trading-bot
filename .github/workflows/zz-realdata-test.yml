name: TEMP real-data test (delete before merging)
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scalper - Alpaca paper account, clock and an option quote
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python -W ignore scalper.py check --no-telegram 2>&1 | grep -v Warning | tail -8
      - name: Watchdog's checks (read only, starts nothing)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh run list -R "$REPO" --workflow pulse.yml --limit 10 --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length' | sed 's/^/active pulse runs: /'
          gh run list -R "$REPO" --workflow pulse.yml --limit 15 --json createdAt,updatedAt --jq '[.[] | select((now - (.createdAt|fromdateiso8601)) < 5400) | select(((.updatedAt|fromdateiso8601) - (.createdAt|fromdateiso8601)) < 900)] | length' | sed 's/^/short pulse runs in 90 min: /'
      - name: Morning briefing with swing trades and bot health (printed, not sent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -W ignore -c "import bot,argparse;c=bot.load_config('config.toml');print(bot.to_plain(bot.morning_briefing(c,argparse.Namespace(csv_dir=None))))" 2>/dev/null
      - name: Copy trade right away on the freshest real insider cluster (not saved)
        run: |
          python -W ignore - 2>/dev/null <<'PY'
          import bot, argparse
          cfg = bot.load_config("config.toml")
          cl = bot.insider_clusters(bot.load_insiders()["buys"], cfg)
          good = sorted([c for c in cl.values() if c["qualified"]], key=lambda c: c["last_filed"], reverse=True)[:3]
          for c in good:
              c = dict(c, first_qualified=bot.datetime.now(bot.timezone.utc).strftime("%Y-%m-%d"))  # pretend it just qualified
              lines, png = bot.copy_now(cfg, argparse.Namespace(csv_dir=None, no_telegram=True), c["symbol"], c)
              print(f"== {c['symbol']} ({c['issuer']}), chart picture: {bool(png)}")
              print(bot.to_plain("\n".join(lines)))
          PY
      - name: Watch pass (printed, not sent, not saved)
        run: python -W ignore bot.py watch --no-telegram 2>/dev/null | head -40
      - name: Nightly scan (printed, not sent, not saved)
        run: python -W ignore bot.py scan --no-telegram --force 2>/dev/null | grep -E "SETUP|Confidence:|Risk check|Swing|Paper|Scan done|Checked" | cut -c1-170 | head -40
      - name: One pulse pass (printed, not sent, not saved)
        run: python -W ignore bot.py pulse --no-telegram 2>&1 | grep -vE "Warning|^\s+df\." | tail -25
