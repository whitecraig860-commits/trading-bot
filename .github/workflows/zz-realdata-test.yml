name: TEMP real-data test (delete before merging)
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scalper, current rules vs adding the failed-bounce trigger (real 1-minute prices)
        run: |
          python -W ignore - <<'PY'
          import yfinance as yf, pandas as pd, numpy as np, scalper
          cfg, full = scalper.load_cfg("config.toml")
          frames = {}
          for sym in cfg["symbols"]:
              fr = []
              end = pd.Timestamp.now(tz="UTC")
              for k in range(4):
                  s0, e0 = end - pd.Timedelta(days=7 * (k + 1)), end - pd.Timedelta(days=7 * k)
                  try:
                      d = yf.Ticker(sym).history(start=s0, end=e0, interval="1m", prepost=False, auto_adjust=False)
                      if d is not None and len(d): fr.append(d)
                  except Exception as e: print(sym, e)
              df = pd.concat(fr).sort_index(); df = df[~df.index.duplicated()]
              df.index = df.index.tz_convert("America/New_York"); frames[sym] = df
          variants = {
              "CURRENT (VWAP/EMA crosses)": dict(cfg),
              "+ failed-bounce trigger": dict(cfg, triggers=["vwap", "ema50", "retest"]),
              "failed-bounce ONLY": dict(cfg, triggers=["retest"]),
              "+ failed-bounce, looser candle check": dict(cfg, triggers=["vwap", "ema50", "retest"], min_body_pct=35, close_zone_pct=45),
          }
          for name, c in variants.items():
              rows = [dict(t, sym=sym) for sym, df in frames.items() for t in scalper.backtest_frame(sym, df, c)]
              r = np.array([t["r"] for t in rows])
              days = pd.DataFrame(rows).groupby("day")["r"].sum() if rows else pd.Series(dtype=float)
              print(f"== {name}: {len(r)} trades, {np.mean(r > 0):.0%} won, avg {r.mean():+.2f}R, total {r.sum():+.1f}R, "
                    f"winning days {(days > 0).sum()}/{len(days)}, worst day {days.min():+.1f}R, best {days.max():+.1f}R")
              for side in ("call", "put"):
                  x = np.array([t["r"] for t in rows if t["side"] == side])
                  if len(x): print(f"     {side}s: {len(x)} trades, avg {x.mean():+.2f}R")
              if rows:
                  d5 = [t for t in rows if t["day"] == "2026-11-05"]
                  print(f"     on 5 Nov (market -4%): {len(d5)} trades, {sum(t['r'] for t in d5):+.2f}R")
                  rt = [t for t in rows if "bounce" in t["why"] or "dip held" in t["why"]]
                  if rt: print(f"     failed-bounce trades: {len(rt)}, avg {np.mean([t['r'] for t in rt]):+.2f}R, {np.mean([t['r'] > 0 for t in rt]):.0%} won")
          PY
