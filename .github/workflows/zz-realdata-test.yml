name: TEMP real-data test (delete before merging)
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Replay 5 Nov bar by bar - what did the scalper see, and what blocked it?
        run: |
          python -W ignore - <<'PY'
          import yfinance as yf, pandas as pd, numpy as np, scalper, intraday as I
          cfg, full = scalper.load_cfg("config.toml")
          for sym in ["SPY", "QQQ", "IWM"]:
              df = yf.Ticker(sym).history(start="2026-10-29", end="2026-11-07", interval="1m", prepost=False, auto_adjust=False)
              df.index = df.index.tz_convert("America/New_York")
              day = df[df.index.strftime("%Y-%m-%d") == "2026-11-05"].between_time("09:30", "15:59")
              o, c = float(day.Open.iloc[0]), float(day.Close.iloc[-1])
              print(f"== {sym}: open {o:.2f} close {c:.2f} ({(c/o-1)*100:+.2f}%), low {day.Low.min():.2f}")
              d5 = scalper.to_bars(df[["Open","High","Low","Close","Volume"]].between_time("09:30","15:59"), 5)
              spec = I.spec_for(sym)
              t5 = I.add_intraday(I.prepare(d5, spec), spec)
              d = t5[t5.session == "2026-11-05"]
              print("   5-min trend reading through the day:")
              print("   " + " | ".join(f"{ts:%H:%M} {r.direction}/{r.kind}" for ts, r in d.iloc[::6].iterrows()))
              bars5 = scalper.to_bars(day, 5)
              ind = scalper.session_indicators(bars5, cfg)
              fired = blocked_trend = blocked_candle = 0
              nofilter = dict(cfg, trend_filter=False, candle_filter=False)
              for i in range(1, len(ind)):
                  ts = ind.index[i]
                  if not scalper.in_window(ts, cfg): continue
                  s1 = scalper.signal_at(ind, i, nofilter, set())
                  if not s1: continue
                  fired += 1
                  side = s1[0]
                  known = t5[t5.index <= ts + pd.Timedelta(minutes=5)]
                  dr, kd = known["direction"].iat[-1], known["kind"].iat[-1]
                  if not scalper.trend_allows(side, dr, kd):
                      blocked_trend += 1; print(f"   {ts:%H:%M} {side}: trend {dr}/{kd} blocked it"); continue
                  if not scalper.candle_ok(ind, i, side, cfg):
                      blocked_candle += 1; print(f"   {ts:%H:%M} {side}: candle check blocked it"); continue
                  print(f"   {ts:%H:%M} {side}: PASSED all filters")
              print(f"   VWAP/EMA cross signals in the window: {fired}, blocked by trend {blocked_trend}, by candle {blocked_candle}")
          PY
