name: TEMP real-data test (delete before merging)
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Headlines now
        run: |
          python -W ignore - 2>&1 <<'PY' | grep -v Warning | head -60
          import bot
          for sym in ["NVDA", "AAPL", "TFC", "RR.L", "GC=F", "BTC-USD", "SOL-USD", "IT"]:
              hs = bot.get_headlines(sym, 3, 72)
              print(sym, bot.news_tone(hs))
              for h in hs: print(f"   {h['title'][:90]} ({h['publisher']}, {bot.ago(h['when'])})")
          PY
      - name: Full nightly scan (printed, not sent, not saved)
        run: python -W ignore bot.py scan --no-telegram 2>/dev/null | grep -E "SETUP|Confidence|chart saved|Resized|^• |Scan done" | cut -c1-160 | head -50
      - name: One pulse pass
        run: python -W ignore bot.py pulse --no-telegram 2>/dev/null | grep -E "OPEN:|SIGNAL|chart saved|WON|LOST|INSIDERS" | head -30
      - name: Chart files made
        run: ls -la "$RUNNER_TEMP/bot-charts" || true
