name: TEMP real-data test (delete before merging)
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scalper rules compared on ~30 days of real 1-minute prices
        run: python -W ignore scalper.py backtest --no-telegram 2>/dev/null | grep -v "^1R here\|^ways\|^A month"
      - name: Same, stricter candle (body 60%, close in top 25%)
        run: |
          sed -e 's/^min_body_pct = 50/min_body_pct = 60/' -e 's/^close_zone_pct = 30/close_zone_pct = 25/' config.toml > /tmp/strict.toml
          python -W ignore scalper.py backtest --no-telegram --config /tmp/strict.toml 2>/dev/null | sed -n '/CURRENT RULES/,$p' | head -14
