name: TEMP real-data test (delete before merging)
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scalper exits and filters on the last month of 1-minute prices
        run: |
          python -W ignore - <<'PY'
          import yfinance as yf, pandas as pd, numpy as np, scalper
          cfg, full = scalper.load_cfg("config.toml")
          frames = {}
          for sym in cfg["symbols"]:
              fs = []
              end = pd.Timestamp.now(tz="UTC")
              for k in range(4):
                  s, e = end - pd.Timedelta(days=7 * (k + 1)), end - pd.Timedelta(days=7 * k)
                  try:
                      d = yf.Ticker(sym).history(start=s, end=e, interval="1m", prepost=False, auto_adjust=False)
                      if d is not None and len(d): fs.append(d)
                  except Exception as exc: print(sym, exc)
              df = pd.concat(fs).sort_index(); df = df[~df.index.duplicated()]; df.index = df.index.tz_convert(scalper.NY)
              frames[sym] = df
          def hours(t, lab):
              t = t.copy(); hh = pd.to_datetime(t["t"]); t["h"] = hh.dt.hour + hh.dt.minute / 60
              for lo, hi, n in ((9.5, 10.5, "9:45-10:30"), (10.5, 11.5, "10:30-11:30"), (11.5, 13.5, "11:30-13:30 midday"), (13.5, 16, "13:30-15:00")):
                  x = t[(t.h >= lo) & (t.h < hi)]
                  if len(x): print(f"   {lab} entries {n:<20} {len(x):>3} trades avg {x.r.mean():+.2f}R {np.mean(x.r > 0):.0%} won")
          def run(name, **over):
              c = dict(cfg, **over)
              rows = [r for sym, df in frames.items() for r in scalper.backtest_frame(sym, df, c)]
              if not rows: print(f"RES {name}: no trades"); return None
              t = pd.DataFrame(rows); days = t.groupby("day")["r"].sum()
              print(f"RES {name:<52} {len(t):>3} tr {np.mean(t.r > 0):>4.0%} won avg {t.r.mean():+.2f}R tot {t.r.sum():+5.1f}R "
                    f"days {(days > 0).sum()}/{len(days)} worst {days.min():+.1f}R {t['exit'].value_counts().to_dict()}")
              return t
          base = run("NEW CONFIG")
          hours(base, "NEW")
          run("new config but entries until 15:00", last_entry="15:00")
          run("old (no lock, no day_agree, until 15:00)", lock_profits=False, day_agree=False, last_entry="15:00")
          PY
