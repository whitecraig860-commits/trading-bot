name: TEMP real-data test (delete before merging)
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Open-trade risk now (to current stops)
        run: python -W ignore -c "import bot,json;c=bot.load_config('config.toml');s=bot.load_state(c);[print(p['symbol'],p['status'],round(bot.position_risk(p,s,c),1)) for p in s['positions']];print('total',round(sum(bot.position_risk(p,s,c) for p in s['positions']),1))"
      - name: Full scan with the ranking (printed, not sent, not saved)
        run: python -W ignore bot.py scan --no-telegram 2>/dev/null | grep -E "SETUP|Confidence:|Risk check|Paper trading|§|Paper trade|Scan done" | cut -c1-170 | head -60
