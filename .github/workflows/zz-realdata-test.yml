name: TEMP real-data test (delete before merging)
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Trump's latest posts, and what the bot read in them
        run: |
          python -W ignore - <<'PY'
          import requests, trump, pandas as pd
          r = requests.get(trump.FEED, timeout=20, headers={"User-Agent": "Mozilla/5.0 (setup-scanner-bot)"})
          print("feed", r.status_code)
          for p in trump.parse_feed(r.text)[:25]:
              eff = trump.read_post(p["text"])
              print(p["when"], "|", p["text"][:160].replace("\n", " "), "|", [(e["market"], e["direction"], e["topic"]) for e in eff])
          PY
      - name: Does the scalper go with the market? Last month of 1-minute prices
        run: |
          python -W ignore - <<'PY'
          import yfinance as yf, pandas as pd, numpy as np, scalper
          cfg, full = scalper.load_cfg("config.toml")
          frames = {}
          for sym in cfg["symbols"]:
              fs = []
              end = pd.Timestamp.now(tz="UTC")
              for k in range(4):
                  s, e = end - pd.Timedelta(days=7 * (k + 1)), end - pd.Timedelta(days=7 * k)
                  try:
                      d = yf.Ticker(sym).history(start=s, end=e, interval="1m", prepost=False, auto_adjust=False)
                      if d is not None and len(d): fs.append(d)
                  except Exception as exc:
                      print(sym, exc)
              df = pd.concat(fs).sort_index(); df = df[~df.index.duplicated()]; df.index = df.index.tz_convert(scalper.NY)
              frames[sym] = df
          spy = frames["SPY"]
          dayret = {str(d): (g["Close"].iloc[-1] / g["Open"].iloc[0] - 1) * 100 for d, g in spy.between_time("09:30", "15:59").groupby(spy.between_time("09:30", "15:59").index.date)}
          def run(name, **over):
              c = dict(cfg, **over)
              rows = [r for sym, df in frames.items() for r in scalper.backtest_frame(sym, df, c)]
              if not rows:
                  print(f"== {name}: no trades"); return None
              t = pd.DataFrame(rows)
              days = t.groupby("day")["r"].sum()
              print(f"== {name}: {len(t)} trades, {np.mean(t.r > 0):.0%} won, avg {t.r.mean():+.2f}R, total {t.r.sum():+.1f}R, "
                    f"winning days {(days > 0).sum()}/{len(days)}, worst day {days.min():+.1f}R")
              for w in ("new high", "new low", "dipped", "bounced up", "VWAP", "EMA"):
                  sub = t[t.why.str.contains(w)]
                  if len(sub): print(f"     with '{w}': {len(sub)} trades, avg {sub.r.mean():+.2f}R, {np.mean(sub.r > 0):.0%} won")
              return t
          base = run("CURRENT RULES")
          hod = run("+ new high/low of the day (after 10:00)", triggers=cfg["triggers"] + ["hod"])
          hod2 = run("+ new high/low of the day (after 10:30)", triggers=cfg["triggers"] + ["hod"], hod_after="10:30")
          eb = run("+ EMA dip that holds", triggers=cfg["triggers"] + ["ema_bounce"])
          both = run("+ both", triggers=cfg["triggers"] + ["hod", "ema_bounce"])
          hodonly = run("new high/low ONLY", triggers=["hod"])
          print("\nDay by day (SPY open to close, and what the scalper did) - current rules vs + new highs/lows:")
          for d in sorted(dayret):
              def side_of(t):
                  if t is None: return "-"
                  x = t[t.day == d]
                  return f"{(x.side == 'call').sum()} calls {(x.side == 'put').sum()} puts {x.r.sum():+.1f}R"
              print(f"  {d}  SPY {dayret[d]:+.2f}%   now: {side_of(base):<26} + new highs/lows: {side_of(hod)}")
          PY
