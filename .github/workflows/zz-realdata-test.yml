name: TEMP real-data test (delete before merging)
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install TA-Lib || echo "TA-Lib not installed (optional)"
      - name: Option-priced backtest, Jan 2025 to now, out-of-sample split
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python -W ignore optionbt.py --start 2025-01-02 --end 2026-11-07 --explore
