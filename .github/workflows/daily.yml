name: Daily check of the paper bots (Telegram)

on:
  schedule:
    - cron: "47 21 * * 1-5"   # weekdays 21:47 UTC, after the US close and the recorder's last save (about 9:47pm UK)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rank every bot's day and send it (reads saved results only; no orders)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker/weekly.py --daily --send
