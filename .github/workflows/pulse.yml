name: Market pulse (every 5 minutes)

on:
  schedule:
    # GitHub often starts scheduled runs late, or drops them when it's busy, so this asks every hour on
    # weekdays from 06:07 to 20:07 UTC. Only one pulse runs at a time: an extra start waits for the running
    # one to finish its shift (about 5.7 hours) and then carries on from there, so the day stays covered
    # without gaps. Extra waiting starts are cancelled by GitHub (grey icons in the Actions tab: that's normal).
    - cron: "7 6-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write   # save the pulse, insider and watch state
  actions: write    # start the scalper at the US open (GitHub's own schedule for it can be hours late)

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Get the latest saved state (this run may have waited behind the previous shift)
        run: git pull --rebase origin main

      - name: Note when this shift started
        run: echo "SHIFT_START=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Read the markets every 5 minutes (also starts the scalper, runs the watch and reads insider filings)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GH_TOKEN: ${{ github.token }}
        run: python bot.py pulse --every 5 --for 340

      - name: Save the pulse, insider and watch state
        if: always()
        run: |
          git config user.name "setup-scanner-bot"
          git config user.email "setup-scanner-bot@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "Pulse $(date -u +%F-%H%M)"
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi

      - name: Start the next shift (GitHub's own schedule can skip hours, so each shift hands over to the next)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ran=$(( $(date -u +%s) - SHIFT_START ))
          day=$(date -u +%u); hm=$((10#$(date -u +%H%M)))
          # Monday to Friday round the clock (the night shift runs the nightly scan at 00:25 UTC), plus Saturday
          # until 01:00 for Friday night's scan; and only after a real shift, so a crash can never loop
          if { [ "$day" -le 5 ] || { [ "$day" -eq 6 ] && [ "$hm" -lt 100 ]; }; } && [ "$ran" -ge 1800 ]; then
            gh workflow run pulse.yml --ref main && echo "Next shift requested."
          else
            echo "No hand-over (day $(date -u +%u), time $(date -u +%H%M), ran ${ran}s)."
          fi
