name: Option price recorder and QQQ paper bot (no orders)

on:
  schedule:
    # Backup starts only: the watchdog starts this within minutes of the US open, and each run starts the next.
    - cron: "5 13,14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # only to start its own next run

concurrency:
  group: recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Record bid and ask prices and run the paper ledger (market data only; no orders)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker/recorder.py
      - name: Save the recorded prices
        if: always()
        run: |
          git config user.name "setup-scanner-bot"
          git config user.email "setup-scanner-bot@users.noreply.github.com"
          git add state/quotes state/qqqbot
          if ! git diff --cached --quiet; then
            git commit -m "Option quotes $(date -u +%F)"
            git pull --rebase
            git push
          fi
      - name: Start the next run if the market is still open
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hm=$((10#$(TZ=America/New_York date +%H%M))); day=$(TZ=America/New_York date +%u)
          if [ "$day" -le 5 ] && [ "$hm" -ge 930 ] && [ "$hm" -lt 1610 ]; then gh workflow run recorder.yml -R "${{ github.repository }}" --ref main; fi
