name: TEMP research run (delete before merging)
on:
  push:
    branches: ["claude/research-qqq-triggers"]
permissions:
  contents: read
jobs:
  study5:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Study 5 (read-only market data; no orders)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python -W ignore research/qqq_triggers_study.py
