name: TEMP research run (delete before merging)
on:
  push:
    branches: ["claude/research-discord-check"]
permissions:
  contents: read
jobs:
  discord-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check posted trades against real option prices (read-only data)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python -W ignore research/discord_check.py
