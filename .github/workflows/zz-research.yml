name: TEMP research run (delete before merging)
on:
  push:
    branches: ["claude/research-trend-following"]
permissions:
  contents: read
jobs:
  study3-trend-following:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Study 3 - diversified ETF trend following (read-only market data; no orders)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python -W ignore research/trend_following_study.py
