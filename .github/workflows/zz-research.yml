name: TEMP research run (delete before merging)
on:
  push:
    branches: ["claude/research-one-a-day"]
permissions:
  contents: read
jobs:
  study6:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Study 6 (read-only market data; no orders)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        working-directory: research
        run: python -W ignore one_a_day_study.py
