name: 0DTE scalper

on:
  schedule:
    # Starts before the US open in summer and winter time; the bot waits for the bell,
    # trades until 15:50 New York time, then stops. A second start on the same day exits at once.
    - cron: "20 13,14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scalper
  cancel-in-progress: false

jobs:
  scalp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Trade the session on paper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python scalper.py run
      - name: Save the day's trades
        if: always()
        run: |
          git config user.name "setup-scanner-bot"
          git config user.email "setup-scanner-bot@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "Scalper $(date -u +%F)"
            git pull --rebase
            git push
          fi
