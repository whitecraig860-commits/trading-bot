# Setup Scanner Bot settings
# Lines starting with # are notes. Change a value, save the file, and run the bot again.

[account]
size = 5000                 # account size; paper trading starts from this
currency = "GBP"            # GBP, USD or EUR
risk_per_trade_pct = 1.0    # % of the account lost if a stop is hit. Keep it at 1 or less.
max_position_pct = 25       # never put more than this % of the account into one position
fractional_units = true     # true if your broker sells fractions of a share (Trading 212 does)

[scan]
interval = "1d"             # "1d" = daily bars (recommended), "1h" = hourly
history = "2y"              # how much price history each scan loads
alert_min_score = 70        # only message you about setups scoring at least this
strong_score = 80           # setups at or above this are labelled STRONG
allow_shorts = false        # true also looks for falling-market setups (needs a spread bet, CFD or margin account)
earnings_warning_days = 7   # flag shares that report earnings within this many days
daily_summary = true        # send a short "scan done" message every run

[setups]
breakout_lookback = 55        # breakout = a close above the highest high of this many bars
breakout_exit_lookback = 20   # breakout trades trail their stop under the lowest low of this many bars
breakout_stop_atr = 2.0       # first stop for breakouts, in ATRs below the entry
pullback_rsi2_entry = 10      # pullback = RSI(2) closing under this while above the 200-day average
pullback_stop_atr = 2.5       # stop for pullbacks, in ATRs below the entry
pullback_max_hold_bars = 10   # pullback trades close after this many bars at most
target_r = 2.0                # reference target shown in alerts, in multiples of the risk
volume_surge = 1.5            # "heavy volume" = at least this many times the 20-bar average
adx_trending = 20             # ADX at or above this counts as a trending market
squeeze_pctile = 0.25         # squeeze = Bollinger width in the narrowest 25% of the last 6 months
overextended_atr = 3.0        # breakouts this many ATRs above the 20-day average lose points

[paper]
enabled = true              # paper-trade strong alerts automatically (no real money)
min_score = 70              # only paper-trade setups scoring at least this
max_open_positions = 8      # at most this many paper trades at once

[backtest]
history = "10y"             # how far back to test
cost_per_side_pct = 0.1     # spread + fees + slippage on each buy and each sell, in %
min_score = 0               # 0 tests every signal so you can compare score bands
in_sample_share = 0.7       # results are split into the first 70% and the last 30% of the period

[telegram]
# Paste your bot token and chat ID here if you run the bot on your own computer.
# On GitHub, leave these empty and add TELEGRAM_TOKEN and TELEGRAM_CHAT_ID as repository secrets.
token = ""
chat_id = ""

[leaders]
top_n = 5                   # weekly momentum ranking: how many to list
send_on_weekday = 0         # 0 = Monday ... 6 = Sunday; -1 turns it off

[movers]
# Each scan also checks Yahoo Finance's lists of the day's most traded shares, biggest risers and
# biggest fallers (like the "most volatile" and "top movers" lists in trading apps).
# They must pass exactly the same rules as your watchlist: being on a list earns no points.
enabled = true
us_lists = ["most_actives", "day_gainers", "day_losers"]   # also: "small_cap_gainers", "most_shorted_stocks"
uk = true                   # the biggest London-listed movers too (companies worth over £1bn)
per_list = 10               # how many from each list
min_price_usd = 5           # skip US shares under $5 (penny stocks)
us_benchmark = "SPY"
uk_benchmark = "^FTSE"

[news]
enabled = true              # add the latest headlines to every alert
headlines = 3               # how many headlines per alert
max_age_hours = 72          # ignore stories older than this
event_warning_days = 2      # warn in alerts when a big event is this many days away or less
yahoo_calendar = true       # also look up big US and UK releases on Yahoo's economic calendar
timezone = "Europe/London"  # times are shown in this time zone
crypto_news = true          # send the day's top crypto headlines with each nightly scan
crypto_symbols = ["BTC-USD", "ETH-USD", "SOL-USD"]
# Big scheduled events (UK time). Add your own; the bot warns you when one is near.
