[watch]
# "python bot.py watch" is a quick check during market hours (the GitHub schedule runs it every 30 minutes).
big_move_pct = 1000   # INACTIVE (10 Nov): only the QQQ trend worker trades now; set back to turn on
big_move_atr = 2.5          # ...or moving more than 2.5x a normal day for that market
breakouts_in_progress = false   # INACTIVE (10 Nov): only the QQQ trend worker trades now; set back to turn on
stop_warnings = true        # tell you when a paper trade's stop is hit during the day
held_news = false   # INACTIVE (10 Nov): only the QQQ trend worker trades now; set back to turn on

[history]
enabled = true              # add each setup's own past record on that market to its alert
period = "10y"              # how far back to look
min_trades = 5              # below this many past signals, the alert says "too few to judge"

[timemachine]
# Every alert replays the trade 10,000 times, drawing real daily bars from that market's own last
# two years, and runs the same stop and exit rules: how often it made money, hit the stop, average R.
enabled = true
replays = 10000
horizon_bars = 60           # follow each replay for up to 60 trading days
lookback_bars = 504         # draw from the last two years of daily bars
seed = 19                   # same seed = same answer every time

[risk]
# Every new trade must PASS these, or it's BLOCKED (no paper trade, and the alert says why).
daily_loss_limit_pct = 10   # no new trades once today's closed losses reach 10% of the account (£100)
weekly_loss_limit_pct = 25  # ...or this week's reach 25% (£250)
max_open_risk_pct = 30      # total that can still be lost across all open trades (£300). With £1,000 of cash it's
                            # usually the cash that limits, not this: "python bot.py backtest --portfolio" shows both.
max_new_trades_per_day = 0   # INACTIVE (10 Nov): only the QQQ trend worker trades now; set back to turn on
low_confidence_budget_pct = 50  # LOW confidence trades can only use the first half of the risk budget, so they can't
                                # crowd out stronger ones. New signals are also ranked each night (breakouts first, then
                                # copy trades, then pullbacks; within each, HIGH confidence first), and open trades count
                                # only what they can still lose to their current stop.
min_replay_avg_r = -1       # e.g. 0.1 blocks trades whose time machine average is below +0.1R; -1 = off

[analysis]
# "python bot.py analyse" reads the market: each market's trend, momentum and volatility, the fear gauge,
# how many watchlist markets are above their 200-day average, and whether that favours longs or shorts.
enabled = true
send_with_scan = false   # INACTIVE (10 Nov): only the QQQ trend worker trades now; set back to turn on
markets = ["SPY", "QQQ", "IWM", "^FTSE", "BTC-USD", "GC=F"]   # your group benchmarks are added too
fear_gauge = "^VIX"         # the US "fear index"; "" turns it off

[pulse]
# "python bot.py pulse --every 5" reads these markets every 5 minutes on 5-minute bars (GitHub runs it on weekdays,
# 07:00-21:35 UTC). For each one it works out: trending up, trending down or choppy; which of four day-trading
# approaches has actually made money on that market over the last 60 days; and whether that approach has a signal
# right now. You get a brief when each market opens, a message when its character changes, signals for the
# approach that's working, and a WON/LOST message for every paper trade it follows.
markets = ["GC=F", "SPY", "QQQ", "IWM", "^FTSE", "BTC-USD"]   # gold, S&P 500, Nasdaq, Russell 2000, FTSE 100, Bitcoin
every_minutes = 5
run_scan = true             # the pulse runs the nightly scan itself at 00:25 UTC (GitHub's schedule ran it up to 6.5 hours late)
send_open_brief = false   # INACTIVE (10 Nov): only the QQQ trend worker trades now; set back to turn on
send_changes = false   # INACTIVE (10 Nov): only the QQQ trend worker trades now; set back to turn on
confirm_bars = 3            # ...only once the change has lasted 3 bars (15 minutes), to stop flip-flopping
min_minutes_between_changes = 60  # ...and at least an hour after the last one for that market
max_changes_per_market = 3  # ...and at most 3 change messages per market per day
send_signals = false   # INACTIVE (10 Nov): only the QQQ trend worker trades now; set back to turn on
max_signals_per_market = 4  # per day
min_trades = 15             # an approach needs this many recent trades before it can be called "working"
min_edge_r = 0.1            # ...and must have made at least +0.1R a trade after costs (in the real-data test,
                            # almost none did: then the pulse says "sit out", which is the right answer)
cost_pct = 0.02             # spread + fees each way, in %, for markets not listed below
costs = { "SPY" = 0.005, "QQQ" = 0.005, "IWM" = 0.01, "GC=F" = 0.01, "^FTSE" = 0.01, "BTC-USD" = 0.05 }
# WON/LOST is shown for your account: the normal risk (£100), but never more than a £350 position (max_position_pct
# of £1,000) would lose at that trade's stop. Intraday stops are tight, so that's usually a few pounds: honest numbers.

[copy]
# Copy the insiders: company directors and bosses buying their own company's shares with their own money.
# US law makes them report every trade to the SEC within two business days (Form 4), and research has found
# their open-market purchases, especially several insiders together or the CEO/CFO, have tended to beat the
# market over the following months. "python bot.py insiders" reads the filings (GitHub does it every morning);
# the nightly scan then scores the strongest ones as "Copy the insiders" trades and paper-trades them.
# US shares only. Insider SALES are ignored: people sell for many reasons that say nothing about the company.
enabled = false   # INACTIVE (10 Nov): only the QQQ trend worker trades now; set back to turn on
live = true                 # also read EDGAR's live feed every 10 minutes while the pulse runs (alerts within minutes)
trade_now = true            # score a fresh insider cluster on the chart at once and copy it on paper straight away
                            # (at the live price while the US market is open, otherwise at the next open)
live_every_minutes = 10
skip_routine = true         # skip insiders who trade in the same month every year (their trades carry no information)
sec_user_agent = ""         # the SEC asks for your name and email, e.g. "Jane Smith jane@example.com".
                            # On GitHub, leave this empty and add an SEC_USER_AGENT secret instead.
fetch_days = 5              # read up to this many days back that haven't been read yet
max_filings_per_run = 6000  # each filing is one download; the SEC allows 10 a second (the bot does 8)
cluster_days = 30           # look at purchases filed in the last 30 days
max_signal_age_days = 7     # only copy if the buying became strong in the last 7 days
min_buy_usd = 10000         # ignore purchases smaller than this
min_total_usd = 50000       # all insiders together must have bought at least this much...
min_insiders = 2            # ...and at least this many insiders bought,
big_buy_usd = 100000        # ...or the CEO, CFO, President or Chair alone bought at least this much
big_total_usd = 250000      # buying this big earns extra points
skip_planned = true         # skip purchases made under a pre-arranged 10b5-1 plan (they carry less information)
include_big_holders = false # true also counts 10% shareholders (often funds) who aren't directors or officers
min_price_usd = 5           # don't copy shares under $5
min_dollar_volume = 1000000 # ...or shares trading less than $1m a day (hard to get in and out of)
max_chase_pct = 15          # lose points if the price is already 15% above what the insiders paid
block_chase_pct = 30        # don't copy at all if it's 30% above
benchmark = "SPY"

[scalper]
# The 0DTE options day-trader (scalper.py). PAPER ONLY: it is hard-wired to Alpaca's paper account.
# Alpaca keys go in GitHub secrets ALPACA_KEY and ALPACA_SECRET (or in alpaca_key / alpaca_secret here
# if you run it on your own computer).
enabled = true
symbols = ["QQQ"]   # trend worker
account_size = 1000         # the scalper's own account (Alpaca paper starts at $100,000, but it only uses this)
account_currency = "GBP"    # account_size is in pounds; messages show £ (converted at today's rate)
account_start = "2026-11-06" # from this day the account grows and shrinks with the scalper's results, and every
                            # trade is sized from what it has then
risk_per_trade_pct = 10.0   # loss if an option's stop is hit: 10% of £1,000 = £100
max_premium_pct = 35        # never spend more than 35% of the account (£350) on one trade, and never more than is free
triggers = ["vwap", "ema50", "hod"]   # "orb" (opening-range breakout) lost money in the real-data test with both old and
                            # new rules. "hod" buys a NEW HIGH of the day (puts on a new low) in the trend's direction,
                            # because a steady trend day never crosses back over VWAP. Last month of real prices: VWAP/EMA
                            # only +23.9R, 11 of 18 days won; with "hod" +25.2R, 13 of 19, same worst day (-2.1R).
                            # "ema_bounce" (buy a dip to the EMA) lost (-0.31R a trade), so it's off.
hod_after = "10:30"         # new highs/lows only count from this time (before it they're mostly the opening range)
use_trump = true            # reads Trump's posts too: for 60 minutes after a market-moving one it won't trade against
trump_minutes = 60          # it (no calls after a tariff threat, no puts after "great time to buy")
require_confluence = true   # calls only when price is above VWAP AND the 50 EMA; puts below both
signal_minutes = 5          # judge the triggers on 5-minute bars (1 = the old 1-minute rules that kept whipsawing)
trend_filter = true         # calls only when the trend is UP, puts only when it's DOWN, nothing when it's choppy
candle_filter = true        # read the candle: only strong candles in the trade's direction (real body, closing near
                            # the high for a call / low for a put), and never chase a move already stretched from VWAP
min_body_pct = 50           # the candle's body must be at least half its full range
close_zone_pct = 30         # ...and close in the top 30% (calls) or bottom 30% (puts) of it
max_chase_atr = 1.5         # skip if price is more than 1.5 normal bars away from VWAP already
max_losses_per_worker = 3   # trend worker
learn_from_journal = false   # trend worker
lesson_min_trades = 30
loss_cooldown_minutes = 5   # trend worker
first_entry = "09:40"   # trend worker
last_entry = "15:00"   # trend worker
                            # (midday chop: 35 trades, 0.00R), and 6 Nov's -£55 QQQ call was bought at 11:55
flat_by = "15:50"           # everything sold by then: 0DTE options expire worthless at the close
stop_loss_pct = 90   # trend worker
take_profit_pct = 1000   # trend worker
trail_after_pct = 1000   # trend worker
trail_giveback_pct = 15
max_hold_minutes = 400   # trend worker
# Taking profits (last month of real prices, 20 days): selling at a 1R move of the share, never letting a trade that
# was 0.5R up turn into a loss, and trailing 0.4R behind once 0.8R up took the win rate from 49% to 73% and the
# winning days from 12 to 15 of 20, with the worst day -1.4R instead of -2.1R. It makes a bit less in total
# (+19.0R vs +24.3R), because the odd big runner is sold early: smaller, steadier wins.
lock_profits = true
target_r = 2.0   # trend worker
be_after_r = 1.0   # trend worker
be_lock_r = 0.1   # trend worker
trail_after_r = 1.5   # trend worker
trail_gap_r = 0.75   # trend worker
lock_after_pct = 1000   # trend worker
lock_floor_pct = 3
# THE HONEST TEST ("python optionbt.py --explore": real 1-minute prices Jan 2025 - Nov 2026, option prices modelled
# with time decay, spreads and fees, settings CHOSEN on 2025 and CHECKED on 2026): the scalper as it was lost money in
# both years (-£1,356 and -£1,140; avg win £36 vs avg loss £38). Three changes helped in BOTH years and are on:
# options with a day left instead of expiring today, no VWAP-reverse exit, and the chart brain's veto (score 2+).
# Together: -£237 in 2025, +£400 in 2026, 237 trades, 54% won, avg win £26 vs avg loss £30: about break-even.
# It has NOT shown a real edge, so it stays on paper. Don't put real money in it unless months of forward paper
# results are clearly positive.
dte = 0   # trend worker
exit_on_reverse_cross = false   # trend worker
brain = false   # trend worker
brain_min_score = 2
brain_veto_15m = true       # never against clear 15-minute highs and lows
brain_veto_1h = false       # (vetoing against the 1-hour trend too made it slightly worse)
explain = true              # every "bought" message has the brain's full read folded underneath
order_flow = true           # adds Alpaca's IEX trades and quotes (a ~2-3% sample; no order book exists on Alpaca)
chart_read = true           # reads the chart before every trade (candles.py): each candle's body and wicks, patterns
                            # (hammer, shooting star, engulfing, doji, three in a row), higher/lower highs and lows,
                            # wicks stacking up at the same price (support/resistance), and whether there's room to the
                            # target. Last month of real prices: 21 trades instead of 32, but 86% won instead of 78%,
                            # +0.60R a trade instead of +0.49R, 11 of 12 days positive. It skipped 3 of the 4 losers of
                            # 6 Nov (a call into resistance, two puts against an uptrend).
chart_min_score = 0         # + for each thing on the chart that agrees, - for each that's against; needs 0 or more
chart_veto_structure = true # never trade against clear higher-highs/higher-lows (or lower-highs/lower-lows)
chart_veto_room = false     # "no room before a wall of wicks" counts -2 in the score instead of a flat no
day_agree = true            # never buy calls while the share is down on the day, or puts while it's up
                            # (last month: +24.3R vs +21.2R, 14 vs 12 winning days, worst day -1.5R vs -2.1R)
max_trades_per_day = 10   # trend worker
max_open_positions = 1   # trend worker
daily_loss_limit_pct = 20   # stops for the day after losing 20% (£200, two full losses). Its record so far is about
                            # break-even, so at £100 a trade a bad day costs a fifth of the account: see the README.
cooldown_minutes = 5   # trend worker
max_spread_pct = 10
event_blackout_minutes = 30 # no new trades 30 min either side of Fed, jobs and inflation releases

# ---------------- Watchlist ----------------
# These are liquid example markets, not picks. Replace them with what you want to watch.
# Each group has a benchmark for the "market trend" and "beating the market" checks.
# Yahoo Finance symbols: US shares like AAPL; London shares end in .L (priced in pence);
# crypto like BTC-USD; currency pairs like GBPUSD=X; gold futures GC=F; indexes start with ^.
# Exchange data for crypto (needs ccxt installed): "kraken:BTC/GBP".
mode = "trend"   # trend worker
tw_option_stop_pct = 100   # trend worker
tw_min_day_move_pct = 0.6   # trend worker

[groups.us]
benchmark = "SPY"
symbols = ["SPY", "QQQ", "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "JPM", "XOM"]

[groups.uk]
benchmark = "^FTSE"
symbols = ["ISF.L", "AZN.L", "SHEL.L", "HSBA.L", "ULVR.L", "RR.L", "BARC.L", "BP.L"]

[groups.crypto]
benchmark = "BTC-USD"
symbols = ["BTC-USD", "ETH-USD", "SOL-USD"]

[groups.popular]
# Gold, silver, Brent oil, the S&P 500, Nasdaq 100 and FTSE 100 indexes, and two currency pairs.
# Indexes can't be bought directly: trade them through an ETF (like ISF.L or SPY) or a spread bet.
benchmark = ""
symbols = ["GC=F", "SI=F", "BZ=F", "^GSPC", "^NDX", "^FTSE", "GBPUSD=X", "EURUSD=X"]
