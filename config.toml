# Setup Scanner Bot settings
# Lines starting with # are notes. Change a value, save the file, and run the bot again.

[account]
size = 1000                 # the money you'll really put in; paper trading starts (again) from this. Changing it
                            # restarts the paper account at the new size and shrinks the open trades to fit.
currency = "GBP"            # GBP, USD or EUR
risk_per_trade_pct = 10.0   # the TARGET loss if a stop is hit: 10% of £1,000 = £100 (LOW £50, HIGH £150). But a trade
                            # can only buy what the free cash pays for (see leverage), so with £1,000 most trades risk
                            # far less: the 10-year test's typical stop is 4.5% below the entry, so a £350 position
                            # risks about £16. Only very jumpy shares, with stops 28%+ away, reach the full £100.
leverage = 1                # 1 = an ordinary share account or ISA (Trading 212 Invest): you can only buy what you have.
                            # 5 = a spread bet or CFD account (you put down 20%). The 10-year test of a £1,000 account
                            # at £100 a trade: leverage 1 made +19.5% a year with a worst fall of 24% (lowest balance
                            # £997); leverage 5 made more in good years but its worst falls were 64-85%. Keep 1.
max_position_pct = 35       # never put more than this % of the account into one position (£350 of £1,000). In the same
                            # test 35% beat 50% and 100% (more trades, smaller falls), so there's room for 2-3 at once
fractional_units = true     # true if your broker sells fractions of a share (Trading 212 does)

[scan]
interval = "1d"             # "1d" = daily bars (recommended), "1h" = hourly
history = "2y"              # how much price history each scan loads
alert_min_score = 101   # INACTIVE (10 Nov): only the QQQ trend worker trades now; set back to turn on
# Per-setup minimum scores (for alerts AND paper trades). The 10-year test on the watchlist found breakouts
# scoring 50-69 did as well as those scoring 70+ (+0.78R a trade vs about +0.4R), so they get a lower bar.
setup_min_score = { breakout = 50 }
strong_score = 80           # setups at or above this are labelled STRONG
allow_shorts = false        # The 10-year test: daily SHORTS lost money (breakouts -0.27R, pullbacks -0.04R a trade) even
                            # with "auto". Shorting still happens in the 5-minute pulse and the scalper's puts.
                            # "auto" = also go short, but only when the wider market is in a downtrend too;
                            # true = shorts everywhere; false = longs only. Shorts need a spread bet, CFD or margin account.
earnings_warning_days = 7   # flag shares that report earnings within this many days
daily_summary = false   # INACTIVE (10 Nov): only the QQQ trend worker trades now; set back to turn on

[setups]
breakout_lookback = 55        # breakout = a close above the highest high of this many bars
breakout_exit_lookback = 20   # breakout trades trail their stop under the lowest low of this many bars
breakout_stop_atr = 2.0       # first stop for breakouts, in ATRs below the entry
pullback_rsi2_entry = 10      # pullback = RSI(2) closing under this while above the 200-day average
pullback_stop_atr = 2.5       # stop for pullbacks, in ATRs below the entry
pullback_exit = "trail"       # "trail" = when it bounces, stop to break-even and let it run under the 20-bar low
                              # (10-year test: +0.12R a trade, best +13.7R); "bounce" = sell on the first bounce
                              # (lots of small wins like +£2, and no edge after costs: -0.01R a trade)
pullback_trail_max_bars = 63  # let-it-run pullbacks are sold after about 3 months at most
pullback_max_hold_bars = 10   # pullback trades close after this many bars at most
target_r = 2.0                # reference target shown in alerts, in multiples of the risk
volume_surge = 1.5            # "heavy volume" = at least this many times the 20-bar average
adx_trending = 20             # ADX at or above this counts as a trending market
squeeze_pctile = 0.25         # squeeze = Bollinger width in the narrowest 25% of the last 6 months
overextended_atr = 3.0        # breakouts this many ATRs above the 20-day average lose points
max_signal_day_atr = 0        # e.g. 3 skips signals made by one huge day (earnings gaps, news shocks). Off: in the
                              # 10-year test it made no difference (breakouts +0.79R either way), so they're kept
copy_stop_atr = 3.0           # copy-the-insiders trades: stop and trailing stop, in ATRs (insiders are often early)
copy_max_hold_bars = 63       # ...and sold after about 3 months at most

[sizing]
# Confidence sizing: before each trade the bot adds up what agrees and what doesn't: the score, whether the wider
# market agrees, this setup's own 10-year record on that market, the time machine, the news headlines (good or
# bad keywords), earnings or big events close by, insider buying, and very high volatility. Each alert lists them.
#   3+ points  -> HIGH confidence:   1.5x the normal risk (£150 at 10% of £1,000)
#   0 or less  -> LOW confidence:    0.5x (£50)
#   otherwise  -> NORMAL:            1x (£100)
# max_risk_pct is a hard ceiling for any one trade: 15% (£150). With £1,000 in an ordinary share account, the cash
# limit almost always makes the real risk smaller (2-4% on average in the 10-year test). If it didn't, the test's
# worst losing run for breakouts (26.7R) would have wiped out most of the account at 10% a trade, which is why
# leverage stays at 1. "python bot.py status" shows how each confidence level has really done, so you can see by
# January whether HIGH trades actually earn their bigger size.
enabled = true
low_mult = 0.5
high_mult = 1.5
high_points = 3
low_points = 0
max_risk_pct = 15.0

[trump]
# Reads Donald Trump's Truth Social posts every 5 minutes while the pulse runs (via trumpstruth.org; Truth Social
# blocks automated readers). A post about tariffs, China, the Fed, oil or Iran, crypto, the stock market or a named
# company gets an alert saying which markets it could move and which way, then a check 30 and 120 minutes later
# of what really happened. Paper only. A free feed is minutes late, so fast traders move first: the checks show
# whether anything is left to catch.
enabled = false   # INACTIVE (10 Nov): only the QQQ trend worker trades now; set back to turn on (the trend worker still reads Trump's posts)
every_minutes = 5
max_markets = 4

[briefing]
enabled = true              # a morning briefing on weekdays from 06:30 UK: top news, then indexes, commodities,
                            # crypto and currencies, green or red

[lessons]
# The trade journal that learns. Every closed trade, win or lose, gets a post-mortem on Telegram: what it had going
# for it, how it played out (wrong from the start? winning then gave it back? nearly stopped out but got lucky?) and,
# 10 days later (20 minutes for the scalper), whether the stop shook it out before the move or it sold too early.
# Once a week the pulse also replays 10 years of history ("python bot.py learn") so the journal starts full.
# A lesson is only USED when it beats luck: at least min_trades trades and a t-statistic of min_t or more. Then it
# adds or removes a confidence point (changing the size of the next trade), and the scalper skips setups with a
# proven losing record. Every alert shows the lessons it used.
enabled = true
min_trades = 30
min_t = 2.0
relearn_days = 7

[charts]
enabled = true              # send a chart picture with alerts, closed trades, pulse signals and scalper trades

[paper]
enabled = true              # paper-trade strong alerts automatically (no real money)
min_score = 70              # only paper-trade setups scoring at least this
max_open_positions = 10     # at most this many swing trades at once (with £1,000 the free cash usually stops it at 3-5)

[backtest]
history = "10y"             # how far back to test
cost_per_side_pct = 0.1     # spread + fees + slippage on each buy and each sell, in %
min_score = 0               # 0 tests every signal so you can compare score bands
in_sample_share = 0.7       # results are split into the first 70% and the last 30% of the period

[telegram]
# Paste your bot token and chat ID here if you run the bot on your own computer.
# On GitHub, leave these empty and add TELEGRAM_TOKEN and TELEGRAM_CHAT_ID as repository secrets.
token = ""
chat_id = ""
compact = true              # long messages show a short summary; the details fold into a box you tap to open
summary_lines = 3           # how many lines stay visible before the fold

[leaders]
top_n = 5                   # weekly momentum ranking: how many to list
send_on_weekday = -1   # INACTIVE (10 Nov): only the QQQ trend worker trades now; set back to turn on

[movers]
# Each scan also checks Yahoo Finance's lists of the day's most traded shares, biggest risers and
# biggest fallers (like the "most volatile" and "top movers" lists in trading apps).
# They must pass exactly the same rules as your watchlist: being on a list earns no points.
enabled = true
us_lists = ["most_actives", "day_gainers", "day_losers"]   # also: "small_cap_gainers", "most_shorted_stocks"
uk = true                   # the biggest London-listed movers too (companies worth over £1bn)
per_list = 10               # how many from each list
min_price_usd = 5           # skip US shares under $5 (penny stocks)
us_benchmark = "SPY"
uk_benchmark = "^FTSE"

[news]
enabled = true              # add the latest headlines to every alert
headlines = 3               # how many headlines per alert
max_age_hours = 72          # ignore stories older than this
event_warning_days = 2      # warn in alerts when a big event is this many days away or less
yahoo_calendar = true       # also look up big US and UK releases on Yahoo's economic calendar
timezone = "Europe/London"  # times are shown in this time zone
crypto_news = false   # INACTIVE (10 Nov): only the QQQ trend worker trades now; set back to turn on
crypto_symbols = ["BTC-USD", "ETH-USD", "SOL-USD"]
# Big scheduled events (UK time). Add your own; the bot warns you when one is near.
events = [
  { date = "2026-10-28", name = "UK Autumn Budget" },
